name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: pinned build tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r tools/kit/requirements-build.txt
      - name: tools/kit tests
        run: |
          python -I -B -m unittest discover -s tools/kit -p 'test_*.py'
      - name: tools/release tests
        run: |
          python -I -B -m unittest discover -s tools/release -p 'test_*.py'
      - name: tools/up tests
        run: |
          python -I -B -m unittest discover -s tools/up -p 'test_*.py'
      - name: tools/recomp tests
        run: |
          python -I -B -m unittest discover -s tools/recomp -p 'test_*.py'
      - name: patch tables
        env:
          BP_NO_GAME: "1"
        run: |
          python -I -B tools/recomp/test_uppatch.py
      - name: tree check
        run: |
          sh tools/release/check_tree.sh

  swift:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build the Porter app
        run: |
          swift build -c release --package-path tools/kit/app
      - name: Porter app tests
        run: |
          swift test --package-path tools/kit/app
